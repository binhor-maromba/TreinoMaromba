<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Projeto Gislaine</title>

<style>
:root{
  --bg:#08090d;
  --card:#151922;
  --card2:#202633;
  --gold:#ffb000;
  --text:#f4f4f4;
  --muted:#a7abb5;
  --line:#30394a;
  --green:#0f8f4d;
  --purple:#5741a6;
  --danger:#a63f4d;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

header{
    padding:22px 18px;
    background:linear-gradient(135deg,#050607,#151922);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
}

h1{
    margin:0;
    color:var(--gold);
    font-size:23px;
}

.sub{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
}

.tabs{
    display:flex;
    gap:8px;
    overflow:auto;
    padding:10px;
    background:#10131a;
    position:sticky;
    top:78px;
    z-index:19;
}

button{
    border:0;
    border-radius:12px;
    padding:10px 13px;
    background:#252b38;
    color:white;
    font-weight:700;
    white-space:nowrap;
}

button.active{
    background:var(--gold);
    color:#111;
}

main{
    padding:14px;
    padding-bottom:100px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:14px;
    margin-bottom:14px;
}

h2{
    color:var(--gold);
    font-size:19px;
    margin:4px 0 10px;
}

.meta{
    color:var(--muted);
    font-size:14px;
    margin-bottom:10px;
}

.ex{
    display:grid;
    grid-template-columns:96px 1fr;
    gap:12px;
    margin:12px 0;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
}

.ex:last-child{
    border-bottom:0;
}

.ex img{
    width:96px;
    border-radius:16px;
    border:1px solid #343c4d;
}

.name{
    font-weight:800;
    font-size:16px;
}

.details{
    font-size:13px;
    color:var(--muted);
    margin-top:3px;
    line-height:1.35;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
}

.link{
    display:inline-block;
    text-decoration:none;
    background:var(--gold);
    color:#111;
    border-radius:10px;
    padding:8px 10px;
    font-weight:800;
    font-size:13px;
}

.timerBtn,
.saveBtn,
.exportBtn,
.filterBtn{
    background:#2f3747;
    color:#fff;
    border-radius:10px;
    padding:8px 10px;
    font-size:13px;
}

.saveBtn{
    background:var(--green);
}

.exportBtn{
    background:var(--purple);
}

.dangerBtn{
    background:var(--danger);
}

.setGrid{
    display:grid;
    grid-template-columns:42px 1fr 1fr;
    gap:6px;
    align-items:center;
    margin-top:7px;
}

.setGrid span{
    font-size:12px;
    color:var(--muted);
}

input,
select{
    background:#0d0f15;
    border:1px solid #343b4b;
    color:white;
    border-radius:8px;
    padding:8px;
    width:100%;
}

.note{
    margin-top:8px;
}

.small{
    font-size:13px;
    color:var(--muted);
}

.gold{
    color:var(--gold);
    font-weight:700;
}

.timerBox{
    position:fixed;
    left:14px;
    right:14px;
    bottom:14px;
    background:#151922;
    border:1px solid var(--line);
    border-radius:18px;
    padding:12px;
    display:none;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    z-index:30;
}

.timerBox strong{
    color:var(--gold);
    font-size:22px;
}

.tableWrap{
    overflow:auto;
}

.table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    min-width:680px;
}

.table th,
.table td{
    border-bottom:1px solid var(--line);
    padding:8px;
    text-align:left;
    vertical-align:top;
}

.statGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    background:var(--card2);
    border-radius:14px;
    padding:12px;
}

.stat b{
    color:var(--gold);
    font-size:20px;
}

.filterGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
}

.historyCard{
    background:var(--card2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin:9px 0;
}

.historyTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.historySets{
    color:var(--muted);
    font-size:13px;
    margin-top:6px;
    line-height:1.5;
}

.status{
    font-size:12px;
    color:#8fe1b5;
    margin-top:7px;
    min-height:14px;
}

.chartWrap{
    background:#0d0f15;
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px;
    overflow:hidden;
}

canvas{
    width:100%;
    height:260px;
    display:block;
}

.toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(30px);
    opacity:0;
    background:#202633;
    border:1px solid var(--line);
    color:#fff;
    padding:12px 16px;
    border-radius:14px;
    z-index:50;
    transition:.22s;
    max-width:90%;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:560px){.setGrid.personal{grid-template-columns:34px 1fr 1fr 72px}.rirInput{max-width:72px}}

.cardioCard{background:#0d0f15;border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0 16px}.cardioSteps{display:grid;gap:6px;margin:10px 0}.cardioStep{display:grid;grid-template-columns:52px 1fr 1fr 1.3fr;gap:6px;align-items:center;padding:8px;border-radius:10px;background:var(--card2);font-size:12px}.cardioStep.active{outline:2px solid var(--gold);background:#292515}.cardioStep.done{opacity:.55}.cardioNow{font-size:15px;line-height:1.5;margin:10px 0}.cardioNow b{color:var(--gold)}.cardioClock{font-size:30px;font-weight:800;color:var(--gold)}.cardioProgress{height:8px;background:#252b38;border-radius:8px;overflow:hidden;margin:8px 0}.cardioProgress>div{height:100%;background:var(--gold);width:0}.cardioRpe{max-width:100px}@media(max-width:560px){.cardioStep{grid-template-columns:45px 1fr 1fr;font-size:11px}.cardioStep span:last-child{grid-column:1/-1}}
</style>
</head>

<script>

const training={
"Terça":["SUPERIORES A", "Treino de superiores", [
["Supino reto com halteres",2,"10-12","90s","Use halteres leves e mantenha o movimento controlado.","flat dumbbell bench press"],
["Puxada alta na polia",2,"10-12","90s","Puxe sem balançar o tronco.","lat pulldown"],

]],
"Quarta":["PERNAS", "Treino de inferiores", [

["Flexora sentada",2,"10-12","90s","Comece com carga leve e movimento controlado.","seated leg curl machine"],
["Abdução de quadril deitada",2,"10-12 por lado","75s","Deitada de lado, mantenha o tronco estável.","side lying hip abduction"],
["Extensão de quadril na polia",1,"10-12 por lado","75s","Apoie-se na estação e evite girar o tronco.","cable hip extension"]
]],
"Quinta":["SUPERIORES B", "Treino de superiores", [
["Supino inclinado com halteres",2,"10-12","90s","Ajuste o banco em inclinação baixa e use halteres leves, com controle.","incline dumbbell bench press"],
["Remada unilateral com halter",2,"10-12 por lado","90s","Apoie uma mão e evite girar o tronco.","one arm dumbbell row"],
["Face pull na polia",2,"10-12","75s","Puxe em direção ao rosto sem elevar os ombros.","cable face pull"],
["Rosca bíceps com halteres",2,"10-12","75s","Faça sentada se preferir e mantenha o tronco estável.","dumbbell biceps curl"],
["Pallof press na polia",1,"8-10 por lado","75s","Use carga leve e mantenha o tronco firme.","cable pallof press"]
]],
"Sexta":["CORPO TODO", "Revisão técnica da semana", [
["Supino reto com halteres",2,"10-12","90s","Repita com carga leve e mantenha a execução controlada.","flat dumbbell bench press"],
["Puxada alta na polia",2,"10-12","90s","Movimento suave, sem inclinar demais o tronco.","lat pulldown"],
["Flexora sentada",1,"10-12","90s","Carga leve e execução controlada.","seated leg curl machine"],
["Elevação lateral com halteres",2,"10-12","75s","Sentada se preferir; controle também a descida.","dumbbell lateral raise"],
["Dead bug alternado",1,"6-8 por lado","75s","No colchonete, mova lados opostos sem arquear a lombar.","dead bug exercise"]
]]
};

const cardioProtocols={
  "superiores":{name:"Dia de superiores",goal:"Cardio leve na bicicleta ergométrica",steps:[
    {min:3,effort:2,label:"Aquecimento",guide:"Pedalada leve, com resistência mínima."},
    {min:4,effort:3,label:"Ritmo confortável",guide:"Mantenha uma cadência tranquila e estável."},
    {min:2,effort:4,label:"Leve aumento",guide:"Aumente um pouco o ritmo, sem forçar."},
    {min:3,effort:2,label:"Desaceleração",guide:"Volte à pedalada leve."}]},
  "inferiores":{name:"Dia de inferiores",goal:"Cardio leve na bicicleta ergométrica",steps:[
    {min:3,effort:2,label:"Aquecimento",guide:"Pedalada leve, com resistência mínima."},
    {min:3,effort:3,label:"Ritmo leve",guide:"Mantenha uma cadência confortável e regular."},
    {min:2,effort:2,label:"Recuperação",guide:"Reduza a cadência e relaxe o ritmo."},
    {min:2,effort:1,label:"Desaceleração",guide:"Pedalada bem leve até terminar."}]}
};

const images=new Proxy({}, {get:(_,name)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240"><rect width="360" height="240" rx="28" fill="#151922"/><rect x="16" y="16" width="328" height="208" rx="22" fill="#202633" stroke="#30394a" stroke-width="2"/><text x="180" y="105" font-family="Arial" font-size="58" text-anchor="middle">💪</text><text x="180" y="157" font-family="Arial" font-size="18" font-weight="700" fill="#ffb000" text-anchor="middle">${String(name).replace(/[&<>]/g,'')}</text><text x="180" y="190" font-family="Arial" font-size="13" fill="#a7abb5" text-anchor="middle">Ver execução no botão</text></svg>`)});
const DUPLICATE_WINDOW_MS=3*60*60*1000;
const STORAGE_KEY='gislaine_history';
const LEGACY_STORAGE_KEY='gislane_history_legacy';

function safeName(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function localDateISO(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function videoLink(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' execução correta')}
function getHistory(){
  try{
    const current=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
    const legacy=JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY)||'[]');
    const merged=[...(Array.isArray(current)?current:[]), ...(Array.isArray(legacy)?legacy:[])];
    const normalized=merged.map(normalizeRecord).filter(Boolean);
    const unique=[...new Map(normalized.map(r=>[r.id,r])).values()];
    if(legacy.length){
      localStorage.setItem(STORAGE_KEY,JSON.stringify(unique));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }
    return unique;
  }catch(e){
    console.error('Erro ao carregar histórico:',e);
    return [];
  }
}
function normalizeRecord(r){
  if(!r||!r.exercise)return null;
  const timestamp=r.timestamp||parseRecordTime(r);
  return {
    id:r.id||`${timestamp}_${safeName(r.day||'')}_${safeName(r.exercise)}_${Math.random().toString(36).slice(2,7)}`,
    timestamp,
    date:r.date||localDateISO(new Date(timestamp)),
    time:r.time||new Date(timestamp).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
    day:r.day||'',
    exercise:r.exercise,
    sets:Array.isArray(r.sets)?r.sets.map((s,i)=>({serie:String(s.serie||i+1),kg:s.kg??'',reps:s.reps??'',rir:s.rir??''})):[],
    obs:r.obs||'',
    sessionId:r.sessionId||''
  };
}
function parseRecordTime(r){
  if(r.timestamp)return Number(r.timestamp);
  if(r.date){
    const dt=new Date(`${r.date}T${r.time||'12:00:00'}`);
    if(!isNaN(dt))return dt.getTime();
  }
  return Date.now();
}
function setHistory(h){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
}

function showToast(msg){
    const el = document.getElementById('toast');

    el.textContent = msg;
    el.classList.add('show');

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(()=>{
        el.classList.remove('show');
    },2600);
}

const tabs=document.getElementById('tabs'),
      content=document.getElementById('content');

function addTab(name,id){
    const b=document.createElement('button');
    b.innerText=name;
    b.dataset.target=id;
    b.onclick=()=>show(id);
    tabs.appendChild(b);
    return b;
}

addTab('Dashboard','dashboard').classList.add('active');
addTab('🧠 Personal','personal');
addTab('Evolução','evolucao');
addTab('Histórico','historico');
addTab('Relatórios','relatorios');
addTab('Cardio','cardio');

Object.keys(training).forEach(day=>addTab(day,day));

function cardioPanelHTML(type){
  const p=cardioProtocols[type]; if(!p)return '';
  const total=p.steps.reduce((a,x)=>a+x.min,0);
  return `<div class="cardioCard" id="cardio_${safeName(type)}"><b>🏃 ${escapeHtml(p.name)}</b><div class="small">Bicicleta ergométrica • ${total} min • intensidade leve</div><div class="cardioNow" id="cardioNow_${safeName(type)}">Pronto para iniciar o protocolo.</div><div class="cardioProgress"><div id="cardioProgress_${safeName(type)}"></div></div><div class="cardioSteps" id="cardioSteps_${safeName(type)}">${p.steps.map((x,i)=>`<div class="cardioStep" data-cardio-type="${type}" data-cardio-step="${i}"><b>${i+1}</b><span>${x.min} min</span><span>Esforço ${x.effort}/10</span><span><b>${escapeHtml(x.label)}</b><br>${escapeHtml(x.guide)}</span></div>`).join('')}</div><div class="actions"><button class="timerBtn" onclick="startCardio('${type}')">▶ Iniciar cardio</button><button class="dangerBtn" onclick="stopCardio('${type}',false)">■ Encerrar</button></div><div class="small" style="margin-top:10px">Esforço percebido (opcional, 1–10):</div><div class="actions"><input class="cardioRpe" id="cardioRpe_${safeName(type)}" type="number" min="1" max="10" placeholder="RPE"><button class="saveBtn" onclick="saveCardioResult('${type}')">💾 Registrar cardio</button></div><div class="status" id="cardioStatus_${safeName(type)}"></div></div>`;
}
const CARDIO_HISTORY_KEY='gislaine_cardio_history';
let cardioTimer=null,cardioState=null;

function startCardio(type){
  const p=cardioProtocols[type];if(!p)return;if(cardioTimer)clearInterval(cardioTimer);
  cardioState={type,step:0,stepEnd:Date.now()+p.steps[0].min*60000,start:Date.now(),completed:false,elapsedSec:0};
  const field=document.getElementById(`cardioRpe_${safeName(type)}`);if(field)field.value='';
  updateCardioUI();cardioTimer=setInterval(cardioTick,500);showToast('Cardio iniciado. Siga a etapa destacada.');
}
function cardioTick(){
  if(!cardioState)return;const p=cardioProtocols[cardioState.type],now=Date.now();cardioState.elapsedSec=Math.max(0,Math.round((now-cardioState.start)/1000));
  while(now>=cardioState.stepEnd){cardioState.step++;if(cardioState.step>=p.steps.length){stopCardio(cardioState.type,true);return}cardioState.stepEnd+=p.steps[cardioState.step].min*60000;if(navigator.vibrate)navigator.vibrate([180,100,180]);showToast(`Próxima etapa: ${p.steps[cardioState.step].label}.`)}
  updateCardioUI();
}
function updateCardioUI(){
  if(!cardioState)return;const type=cardioState.type,p=cardioProtocols[type],step=p.steps[Math.min(cardioState.step,p.steps.length-1)];
  const remain=Math.max(0,Math.ceil((cardioState.stepEnd-Date.now())/1000)),mm=String(Math.floor(remain/60)).padStart(2,'0'),ss=String(remain%60).padStart(2,'0');
  const now=document.getElementById(`cardioNow_${safeName(type)}`);if(now)now.innerHTML=`<span class="cardioClock">${mm}:${ss}</span><br><b>${escapeHtml(step.label)} • esforço ${step.effort}/10</b><br>${escapeHtml(step.guide)}`;
  const total=p.steps.reduce((a,x)=>a+x.min*60,0),prog=document.getElementById(`cardioProgress_${safeName(type)}`);if(prog)prog.style.width=`${Math.min(100,cardioState.elapsedSec/total*100)}%`;
  document.querySelectorAll(`[data-cardio-type="${type}"]`).forEach((el,i)=>{el.classList.toggle('active',i===cardioState.step);el.classList.toggle('done',i<cardioState.step)});
}
function stopCardio(type,completed){
  if(!cardioState||cardioState.type!==type)return;if(cardioTimer)clearInterval(cardioTimer);cardioTimer=null;cardioState.completed=!!completed;cardioState.end=Date.now();cardioState.elapsedSec=Math.max(1,Math.round((cardioState.end-cardioState.start)/1000));
  const now=document.getElementById(`cardioNow_${safeName(type)}`);if(now)now.innerHTML=completed?'<b>✅ Protocolo concluído.</b> Registre o esforço percebido se quiser.':`<b>⏹ Cardio encerrado.</b> Tempo realizado: ${Math.max(1,Math.round(cardioState.elapsedSec/60))} min.`;
  if(completed&&navigator.vibrate)navigator.vibrate([250,120,250,120,400]);showToast(completed?'Cardio concluído!':'Cardio encerrado.');
}
function saveCardioResult(type){
  if(!cardioState||cardioState.type!==type){showToast('Inicie e encerre o cardio antes de registrar.');return}
  const input=document.getElementById(`cardioRpe_${safeName(type)}`),rpe=Number(input?.value||0);if(input?.value&&(rpe<1||rpe>10)){showToast('Informe um RPE entre 1 e 10.');return}
  const p=cardioProtocols[type],h=getCardioHistory();h.push({id:`cardio_${Date.now()}`,timestamp:Date.now(),date:localDateISO(),day:type==='superiores'?'Treino de superiores':'Treino de inferiores',protocol:p.name,durationMin:Math.max(1,Math.round(cardioState.elapsedSec/60)),completed:!!cardioState.completed,rpe:rpe||'',sessionId:''});setCardioHistory(h);
  const st=document.getElementById(`cardioStatus_${safeName(type)}`);if(st)st.textContent=`Cardio registrado: ${Math.max(1,Math.round(cardioState.elapsedSec/60))} min${rpe?` • RPE ${rpe}`:''}.`;
  cardioState=null;showToast('Cardio registrado com sucesso.');
}

function show(id){

    document.querySelectorAll(".page")
        .forEach(x=>x.classList.remove("active"));

    document.querySelectorAll(".tabs button")
        .forEach(x=>x.classList.remove("active"));

    const page=document.getElementById(id);

    if(page)
        page.classList.add("active");

    const tab=[...tabs.children].find(b=>b.dataset.target===id);

    if(tab)
        tab.classList.add("active");

    refreshAll();

}

function collectSets(key){
  const sets=[];
  document.querySelectorAll(`[data-key="${key}"][data-set]`).forEach(el=>{
    const serie=el.dataset.set,type=el.dataset.type;
    let obj=sets.find(x=>x.serie===serie);
    if(!obj){obj={serie,kg:'',reps:'',rir:''};sets.push(obj)}
    obj[type]=el.value;
  });
  return sets;
}
function saveExercise(day,exercise,key){

    const now = Date.now();

    const sets = collectSets(key);

    const obs = (
        document.querySelector(`[data-key="${key}"][data-type="obs"]`) || {}
    ).value || "";

    let h = getHistory();

    // Evita salvar duas vezes em sequência
    const duplicateIndex = h.findIndex(r=>

        r.day===day &&
        r.exercise===exercise &&
        Math.abs(now-r.timestamp)<=DUPLICATE_WINDOW_MS

    );

    const record={

        id:
            duplicateIndex>=0
            ? h[duplicateIndex].id
            : `${now}_${safeName(day)}_${safeName(exercise)}`,

        timestamp:now,

        date:localDateISO(),

        time:new Date().toLocaleTimeString('pt-BR',{
            hour:'2-digit',
            minute:'2-digit'
        }),

        day,
        exercise,
        sets,
        obs,
        sessionId:getActiveSession(day)?.id||''

    };

    const status=document.getElementById(`status_${key}`);

    if(duplicateIndex>=0){

        h[duplicateIndex]=record;

        if(status){

            status.textContent=
                "Treino atualizado.";

        }

        showToast("Treino atualizado com sucesso.");

    }else{

        h.push(record);

        if(status){

            status.textContent=
                "Treino salvo com sucesso.";

        }

        showToast("Treino salvo com sucesso.");

    }

    h.sort((a,b)=>a.timestamp-b.timestamp);

    setHistory(h);

    // Atualiza imediatamente toda a interface
    refreshAll();

}

function exportCSV(day=null){

    const h=filtered(day);

    const rows=[[
        'Data',

        'Dia',
        'Exercício',
        'Série',
        'Carga (kg)',
        'Repetições',
        'Volume',

        r.sets.forEach(s=>{

            rows.push([
                r.date,
                r.time || '',
                r.day,
                r.exercise,
                s.serie,
                s.kg,
                s.reps,
                (Number(s.kg)||0)*(Number(s.reps)||0),
                r.obs
            ]);

        });

    });

    const csv='\ufeff'+rows
        .map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(';'))
        .join('\n');

    download(

        day
            ? `Treino_${day}_Gislaine.csv`

        'text/csv;charset=utf-8'

function download(name,text,type){

    const a=document.createElement('a');

    a.href=URL.createObjectURL(
        new Blob([text],{
            type:type || 'text/plain'
        })
    );

    a.download=name;

    a.click();

    setTimeout(()=>{

        URL.revokeObjectURL(a.href);

    },1000);

}

document.getElementById('importFile').addEventListener('change',ev=>{

    const file=ev.target.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=()=>{

        try{

            const data=JSON.parse(reader.result);

            if(!Array.isArray(data))
                throw new Error();

            const normalized=data
                .map(normalizeRecord)
                .filter(Boolean);

            setHistory(normalized);

            showToast("Backup restaurado com sucesso!");

            refreshAll();

        }catch(e){

            showToast("Arquivo de backup inválido.");

        }

    };

    reader.readAsText(file);

    ev.target.value='';

});

function escapeHtml(s){

    return String(s).replace(

        /[&<>"']/g,

        c=>({

            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#039;'

        }[c])

    );

}

function aggregateEvolution(exercise,period,metric){

    let h = getHistory()

        .filter(r=>r.exercise===exercise);

    if(period!=="all"){

        const cutoff =
            Date.now() - Number(period) * 86400000;

        h = h.filter(r=>r.timestamp>=cutoff);

    }

    const byDate = {};

    h.forEach(r=>{

        if(!byDate[r.date]){

            byDate[r.date]={

                max:0,
                volume:0

            };

        }

        r.sets.forEach(s=>{

            const kg = Number(s.kg) || 0;
            const reps = Number(s.reps) || 0;

            byDate[r.date].max =
                Math.max(byDate[r.date].max,kg);

            byDate[r.date].volume += kg * reps;

        });

    });

    return Object.entries(byDate)

        .sort((a,b)=>a[0].localeCompare(b[0]))

        .map(([date,v])=>({

            date,
            value:v[metric]

        }));

}

function drawEvolutionChart(){

    const canvas=document.getElementById("evolutionChart");

    if(!canvas) return;

    const ctx=canvas.getContext("2d");

    const exercise=chartExercise.value;
    const period=chartPeriod.value;
    const metric=chartMetric.value;

    const data=exercise
        ? aggregateEvolution(exercise,period,metric)
        : [];

    const W=canvas.width;
    const H=canvas.height;

    const pad={
        l:60,
        r:22,
        t:25,
        b:52
    };

    ctx.clearRect(0,0,W,H);

    ctx.fillStyle="#0d0f15";
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle="#30394a";
    ctx.lineWidth=1;

    for(let i=0;i<5;i++){

        const y=pad.t+(H-pad.t-pad.b)*i/4;

        ctx.beginPath();
        ctx.moveTo(pad.l,y);
        ctx.lineTo(W-pad.r,y);
        ctx.stroke();

    }

    if(!data.length){

        ctx.fillStyle="#a7abb5";
        ctx.font="18px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            "Sem dados suficientes para este gráfico",
            W/2,
            H/2
        );

        chartInfo.textContent="";

        return;

    }

    const max=Math.max(...data.map(d=>d.value),1);
    const min=Math.min(...data.map(d=>d.value),0);

    const range=Math.max(max-min,1);

    const plotW=W-pad.l-pad.r;
    const plotH=H-pad.t-pad.b;

    const pts=data.map((d,i)=>({

        x:
            pad.l+
            (data.length===1
                ? plotW/2
                : plotW*i/(data.length-1)
            ),

        y:
            pad.t+
            plotH-
            ((d.value-min)/range)*plotH,

        ...d

    }));

    ctx.strokeStyle="#ffb000";
    ctx.lineWidth=4;

    ctx.beginPath();

    pts.forEach((p,i)=>{

        if(i)
            ctx.lineTo(p.x,p.y);
        else
            ctx.moveTo(p.x,p.y);

    });

    ctx.stroke();

    pts.forEach(p=>{

        ctx.fillStyle="#ffb000";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            6,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    ctx.fillStyle="#a7abb5";
    ctx.font="13px Arial";
    ctx.textAlign="right";

    for(let i=0;i<5;i++){

        const val=max-(range*i/4);

        const y=pad.t+plotH*i/4;

        ctx.fillText(
            Math.round(val),
            pad.l-10,
            y+4
        );

    }

    ctx.textAlign="center";

    const step=Math.max(
        1,
        Math.ceil(data.length/6)
    );

    pts.forEach((p,i)=>{

        if(i%step===0 || i===pts.length-1){

            ctx.fillText(
                p.date.slice(5),
                p.x,
                H-22
            );

        }

    });

    chartInfo.textContent=

`${exercise}

${metric==="max"
    ? "Maior carga"
    : "Volume movimentado"}

em ${data.length} treino(s).

Último valor:
${Math.round(data[data.length-1].value)}

${metric==="max"
    ? "kg"
    : "kg movimentados"}`;

}

function latestRecords(exercise){

    return getHistory()

        .filter(r=>r.exercise===exercise)

        .sort((a,b)=>b.timestamp-a.timestamp);

}

function lastSessionText(day,exercise){

    const history=latestRecords(exercise)

        .filter(r=>r.day===day);

    if(!history.length){

        return `

<div class="lastSession">

<b>📅 Último treino</b><br>

Nenhum treino registrado.

</div>

`;

    }

    const last=history[0];

    let maior=0;

    let volume=0;

    const linhas=last.sets.map(s=>{

        const kg=Number(s.kg)||0;

        const reps=Number(s.reps)||0;

        maior=Math.max(maior,kg);

        volume+=kg*reps;

        return `S${s.serie}: <b>${kg}</b> kg × ${reps}${s.rir!==undefined && s.rir!=="" ? ` • RIR ${escapeHtml(s.rir)}` : ""}`;

    }).join("<br>");

    return `

<div class="lastSession">

<b>📅 Último treino</b>

<br>

${last.date}

<hr>

${linhas}

<hr>

🏋️ Maior carga:
<b>${maior} kg</b>

<br>

📦 Volume:
<b>${Math.round(volume)} kg</b>

</div>

`;

}

function getRepRange(value){
    const numbers=String(value).match(/\d+/g)?.map(Number)||[];
    return {
        min:numbers[0]||10,
        max:numbers[1]||numbers[0]||10
    };
}

function suggestedProgression(exercise,target){
    const hist=latestRecords(exercise);
    if(!hist.length) return "🔵 Primeiro treino: escolha uma carga confortável e termine com RIR 2–3.";
    const last=hist[0];
    const valid=last.sets.map(s=>({kg:Number(s.kg),reps:Number(s.reps),rir:s.rir===''?null:Number(s.rir)}))
      .filter(s=>s.kg>0 && s.reps>0);
    if(!valid.length) return "Sem dados suficientes para sugerir progressão.";
    const peso=Math.max(...valid.map(s=>s.kg));
    const top=Number(target)||10;
    const min=Math.max(1,top-2);
    const allTop=valid.every(s=>s.reps>=top);
    const anyBelow=valid.some(s=>s.reps<min);
    const rirs=valid.filter(s=>Number.isFinite(s.rir)).map(s=>s.rir);
    const avgRir=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
    if(allTop && (avgRir===null || avgRir>=1)) return `🟢 Progressão confirmada: tente ${formatKg(nextLoad(peso))} kg • meta ${min}–${top} reps • RIR 1–2`;
    if(anyBelow || (avgRir!==null && avgRir<0.5)) return `🔴 Mantenha ${formatKg(peso)} kg e consolide ${min}–${top} reps antes de subir.`;
    return `🟡 Mantenha ${formatKg(peso)} kg • tente acrescentar reps até ${top} em todas as séries • RIR 1–2.`;
}
function nextLoad(kg){ return Math.round((Number(kg)+2.5)*2)/2; }
function formatKg(n){ return Number.isInteger(n)?String(n):Number(n).toFixed(1).replace('.',','); }

function fillLastLoads(day,exercise,key){

    const hist=latestRecords(exercise)

        .filter(r=>r.day===day);

    if(!hist.length) return;

    const last=hist[0];

    last.sets.forEach(s=>{

        const kg=document.querySelector(

`[data-key="${key}"][data-set="${s.serie}"][data-type="kg"]`

);

        const reps=document.querySelector(

`[data-key="${key}"][data-set="${s.serie}"][data-type="reps"]`

);

        if(kg && !kg.value)

            kg.placeholder=s.kg;

        if(reps && !reps.value) reps.placeholder=s.reps;
        const rir=document.querySelector(`[data-key="${key}"][data-set="${s.serie}"][data-type="rir"]`);
        if(rir && !rir.value && s.rir!==undefined && s.rir!=="") rir.placeholder=s.rir;

    });

}

const SESSION_KEY='gislaine_workout_sessions';
const ACTIVE_SESSION_KEY='gislaine_active_sessions';
function getSessions(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'[]')}catch(e){return []}}
function setSessions(v){localStorage.setItem(SESSION_KEY,JSON.stringify(v))}
function getActiveSessions(){try{return JSON.parse(localStorage.getItem(ACTIVE_SESSION_KEY)||'{}')}catch(e){return {}}}
function getActiveSession(day){return getActiveSessions()[day]||null}
function startWorkoutSession(day){
  const all=getActiveSessions(); if(all[day]){showToast('A sessão deste treino já está ativa.');return}
  const now=Date.now(); all[day]={id:`sess_${now}_${safeName(day)}`,day,start:now,date:localDateISO()};
  localStorage.setItem(ACTIVE_SESSION_KEY,JSON.stringify(all)); showToast('Sessão iniciada. Bons treinos!'); refreshAll();
}
function finishWorkoutSession(day){
  const all=getActiveSessions(); let active=all[day];
  const todayRecords=getHistory().filter(r=>r.day===day && r.date===localDateISO());
  if(!active && !todayRecords.length){showToast('Nenhum exercício registrado hoje.');return}
  if(!active){const first=Math.min(...todayRecords.map(r=>r.timestamp));active={id:`sess_${first}_${safeName(day)}`,day,start:first,date:localDateISO()}}
  const records=getHistory().filter(r=>r.day===day && (r.sessionId===active.id || (!r.sessionId && r.timestamp>=active.start && r.date===active.date)));
  if(!records.length){showToast('Salve pelo menos um exercício antes de finalizar.');return}
  const end=Date.now(); const metrics=calcSessionMetrics(records);
  const cardio=getCardioHistory().filter(c=>c.day===day && c.date===active.date && (c.sessionId===active.id || (!c.sessionId && c.timestamp>=active.start))).slice(-1)[0]||null;
  const sessions=getSessions(); sessions.push({...active,end,durationMin:Math.max(1,Math.round((end-active.start)/60000)),exerciseCount:records.length,cardio,...metrics}); setSessions(sessions);
  delete all[day]; localStorage.setItem(ACTIVE_SESSION_KEY,JSON.stringify(all));
  showToast(`Treino finalizado: ${records.length} exercícios • ${Math.round(metrics.volume)} kg de volume.`); refreshAll();
}
function calcSessionMetrics(records){
  let volume=0,sets=0,reps=0; records.forEach(r=>r.sets.forEach(s=>{const k=Number(s.kg)||0, rp=Number(s.reps)||0;if(k>0&&rp>0){sets++;reps+=rp;volume+=k*rp}})); return {volume,sets,reps};
}
function renderSessionPanels(){
  Object.keys(training).forEach(day=>{const el=document.getElementById(`sessionInfo_${safeName(day)}`);if(!el)return;const a=getActiveSession(day);const today=getHistory().filter(r=>r.day===day&&r.date===localDateISO()).length;
    el.innerHTML=a?`<span class="good">Sessão ativa</span> desde ${new Date(a.start).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} • ${today} exercício(s) salvo(s).`:`${today?today+' exercício(s) registrado(s) hoje.':'Pronto para iniciar.'}`;
  });
}
function exercisePR(exercise){
  const h=latestRecords(exercise);let maxKg=0,maxVol=0,bestReps=0;h.forEach(r=>{let v=0;r.sets.forEach(s=>{const k=Number(s.kg)||0,rp=Number(s.reps)||0;maxKg=Math.max(maxKg,k);bestReps=Math.max(bestReps,rp);v+=k*rp});maxVol=Math.max(maxVol,v)});return {maxKg,maxVol,bestReps};
}
function progressionState(exercise,repsSpec){
  const h=latestRecords(exercise),range=getRepRange(repsSpec);if(!h.length)return {cls:'',text:'Primeiro registro pendente'};
  const recent=h.slice(0,4);const last=recent[0];const valid=last.sets.filter(s=>Number(s.kg)>0&&Number(s.reps)>0);if(!valid.length)return {cls:'',text:'Sem séries válidas'};
  const max=Math.max(...valid.map(s=>Number(s.kg)));const allTop=valid.every(s=>Number(s.reps)>=range.max);const rirs=valid.map(s=>Number(s.rir)).filter(Number.isFinite);const avg=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
  if(allTop&&(avg===null||avg>=1))return {cls:'good',text:`Subir para ${formatKg(nextLoad(max))} kg`};
  if(recent.length>=3){const maxima=recent.map(r=>Math.max(0,...r.sets.map(s=>Number(s.kg)||0)));if(maxima.every(x=>x===max))return {cls:'warn',text:`Carga estável há ${recent.length} sessões — buscar reps antes de subir`}}
  return {cls:'warn',text:`Manter ${formatKg(max)} kg e progredir repetições`};
}
function renderPersonal(){
  const sum=document.getElementById('personalSummary'),box=document.getElementById('personalExercises'),sh=document.getElementById('sessionHistory');if(!sum||!box||!sh)return;
  const h=getHistory();const last7=Date.now()-7*86400000;const week=h.filter(r=>r.timestamp>=last7);const m=calcSessionMetrics(week);const prs=[];
  const allExercises=[];Object.values(training).forEach(d=>d[2].forEach(e=>{if(!allExercises.some(x=>x[0]===e[0]))allExercises.push(e)}));
  allExercises.forEach(e=>{const pr=exercisePR(e[0]);if(pr.maxKg)prs.push([e[0],pr])});
  sum.innerHTML=h.length?`Nos últimos 7 dias: <b>${week.length}</b> exercícios registrados, <b>${m.sets}</b> séries válidas e <b>${Math.round(m.volume)} kg</b> de volume. O Personal usa a faixa de repetições e o RIR informado para decidir entre manter, consolidar ou progredir a carga.`:'Ainda não há histórico. Registre o primeiro treino para ativar as recomendações.';
  box.innerHTML=allExercises.map(e=>{const state=progressionState(e[0],e[2]),pr=exercisePR(e[0]);return `<div class="personalAdvice"><b>${escapeHtml(e[0])}</b>${pr.maxKg?` <span class="prBadge">PR ${formatKg(pr.maxKg)} kg</span>`:''}<br><span class="${state.cls}">${state.text}</span><br><span class="small">Faixa: ${escapeHtml(e[2])} reps • alvo sugerido: RIR 1–2${pr.maxVol?` • melhor volume: ${Math.round(pr.maxVol)} kg`:''}</span></div>`}).join('');
  const sessions=getSessions().slice().sort((a,b)=>b.end-a.end).slice(0,8);sh.innerHTML=sessions.length?sessions.map(x=>`<div class="historyCard"><b>${escapeHtml(x.day)} • ${escapeHtml(x.date)}</b><br>${x.exerciseCount} exercícios • ${x.sets} séries • ${Math.round(x.volume)} kg • ${x.durationMin} min</div>`).join(''):'Nenhuma sessão finalizada ainda. Os exercícios continuam sendo salvos mesmo sem finalizar a sessão.';
}

function refreshAll(){

    refreshFilters();

    renderStats();

    renderHistory();

    renderProgressHints();

    renderTodaySession();
    renderSessionPanels();
    renderPersonal();

    drawEvolutionChart();

}
let t = null;

let remaining = 0;

let timerEnd = 0;

const TIMER_KEY = "gislaine_timer_end";
const timerBox = document.getElementById("timerBox");
const timerText = document.getElementById("timerText");

function startTimer(sec){

    timerEnd = Date.now() + Number(sec)*1000;

    localStorage.setItem(
        TIMER_KEY,
        String(timerEnd)
    );

    timerBox.style.display="flex";

    clearInterval(t);

    tick();

    t=setInterval(tick,250);

}

function tick(){

    timerEnd = Number(
        localStorage.getItem(TIMER_KEY) || timerEnd || 0
    );

    remaining = Math.max(
        0,
        Math.ceil((timerEnd-Date.now())/1000)
    );

    timerText.innerText =
        remaining>0
            ? remaining+"s"
            : "OK";

    if(remaining<=0){

        clearInterval(t);
        t=null;
        localStorage.removeItem(TIMER_KEY);
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
        showToast("Descanso concluído!");

    }

}

function stopTimer(){

    clearInterval(t);

    localStorage.removeItem(TIMER_KEY);

    timerBox.style.display="none";

}

function restoreTimer(){

    const end = Number(
        localStorage.getItem(TIMER_KEY) || 0
    );

    if(end>Date.now()){

        timerEnd=end;

        timerBox.style.display="flex";

        clearInterval(t);

        tick();

        t=setInterval(tick,250);

    }else if(end){

        localStorage.removeItem(TIMER_KEY);

    }

}

restoreTimer();

refreshAll();

if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
